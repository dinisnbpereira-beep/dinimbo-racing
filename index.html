// ---------------- spline ----------------
function catmullRom(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3),
  ];
}

function buildSamples(pts) {
  const raw = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let s = 0; s < 24; s++) raw.push(catmullRom(p0, p1, p2, p3, s / 24));
  }
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of raw) {
    if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
    if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
  }
  const sc = WORLD / Math.max(maxx - minx, maxy - miny);
  const ox = (WORLD - (maxx - minx) * sc) / 2, oy = (WORLD - (maxy - miny) * sc) / 2;
  lastNorm = { minx, miny, sc, ox, oy };
  return raw.map(p => [(p[0] - minx) * sc + ox, (p[1] - miny) * sc + oy]);
}

function trackDir(i) {
  const a = samples[(i + 2) % NS], b = samples[(i - 2 + NS) % NS];
  return Math.atan2(a[1] - b[1], a[0] - b[0]);
}

function distToTrack(x, y) {
  let bd = Infinity;
  for (const p of samples) {
    const dx = x - p[0], dy = y - p[1];
    const d = dx * dx + dy * dy;
    if (d < bd) bd = d;
  }
  return Math.sqrt(bd);
}

function makeBlob(pts, seg) {
  const raw = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let s = 0; s < seg; s++) raw.push(catmullRom(p0, p1, p2, p3, s / seg));
  }
  return raw;
}

function inLake(x, y) {
  if (!lakePath.length) return false;
  let inside = false;
  for (let a = 0, b = lakePath.length - 1; a < lakePath.length; b = a++) {
    const p = lakePath[a], q = lakePath[b];
    if ((p[1] > y) !== (q[1] > y) && x < (q[0] - p[0]) * (y - p[1]) / (q[1] - p[1]) + p[0]) inside = !inside;
  }
  return inside;
}

function loadTrack(i) {
  trackIdx = i;
  curTheme = THEMES[TRACKS[i].theme];
  samples = buildSamples(TRACKS[i].pts);
  NS = samples.length;
  lakePath = [];
  trackPath = new Path2D();
  samples.forEach((p, i) => i ? trackPath.lineTo(p[0], p[1]) : trackPath.moveTo(p[0], p[1]));
  trackPath.closePath();
  if (TRACKS[i].lake) {
    const t = lastNorm;
    lakePath = makeBlob(TRACKS[i].lake, 14).map(p => [
      (p[0] - t.minx) * t.sc + t.ox, (p[1] - t.miny) * t.sc + t.oy,
    ]);
  }
  worldB = { minx: 0, miny: 0, maxx: WORLD, maxy: WORLD };
  for (const p of samples) {
    if (p[0] < worldB.minx) worldB.minx = p[0]; if (p[0] > worldB.maxx) worldB.maxx = p[0];
    if (p[1] < worldB.miny) worldB.miny = p[1]; if (p[1] > worldB.maxy) worldB.maxy = p[1];
  }
  const M = 500;
  worldB.minx -= M; worldB.miny -= M; worldB.maxx += M; worldB.maxy += M;
  blobs = [];
  for (let b = 0; b < 90; b++) {
    blobs.push({
      x: worldB.minx + Math.random() * (worldB.maxx - worldB.minx),
      y: worldB.miny + Math.random() * (worldB.maxy - worldB.miny),
      rx: 18 + Math.random() * 30, ry: 8 + Math.random() * 12,
      a: Math.random() * Math.PI * 2,
    });
  }
  scenery = [];
  const clear = TRACK_W / 2 + 55;
  for (let gx = worldB.minx + 80; gx < worldB.maxx - 80; gx += 150) {
    for (let gy = worldB.miny + 80; gy < worldB.maxy - 80; gy += 150) {
      const x = gx + (Math.random() - .5) * 110, y = gy + (Math.random() - .5) * 110;
      if (distToTrack(x, y) < clear) continue;
      if (inLake(x, y)) continue;
      if (Math.random() < 0.5) continue;
      const r = Math.random();
      let type;
      if (curTheme.flora === "city") type = r < 0.55 ? "tower" : "palm";
      else if (curTheme.flora === "palm") type = r < 0.8 ? "palm" : "house";
      else if (curTheme.flora === "mixed") type = r < 0.4 ? "palm" : (r < 0.85 ? "tree" : "house");
      else type = r < 0.78 ? curTheme.flora : "house";
      const o = {
        type, x, y, s: 0.8 + Math.random() * 0.5, r: Math.random() * Math.PI * 2,
        leaf: Math.floor(Math.random() * curTheme.leaves.length),
        roof: curTheme.roofs[Math.floor(Math.random() * curTheme.roofs.length)],
      };
      if (type === "tower") {
        const w = 26 + Math.random() * 16, h = 60 + Math.random() * 62;
        o.spr = makeTowerSprite(w, h, curTheme.towerBodies[Math.floor(Math.random() * curTheme.towerBodies.length)]);
        o.sw = w; o.sh = h;
      }
      scenery.push(o);
    }
  }
  stands = [];
  for (let k = 0; k < 4; k++) {
    const i = Math.round(k * NS / 4) % NS;
    const p = samples[i], d = trackDir(i);
    let side = k % 2 ? 1 : -1;
    const off = TRACK_W / 2 + 52;
    let sx = p[0] + Math.cos(d + side * Math.PI / 2) * off;
    let sy = p[1] + Math.sin(d + side * Math.PI / 2) * off;
    if (inLake(sx, sy)) {
      side = -side;
      sx = p[0] + Math.cos(d + side * Math.PI / 2) * off;
      sy = p[1] + Math.sin(d + side * Math.PI / 2) * off;
    }
    stands.push({
      x: sx, y: sy,
      a: d + (side < 0 ? Math.PI : 0),
    });
  }
  cam.x = samples[0][0]; cam.y = samples[0][1];
  placeAtStart();
}

function placeAtStart() {
  car.nearest = 0;
  car.x = samples[0][0]; car.y = samples[0][1];
  car.angle = trackDir(0);
  car.speed = 0; car.midPassed = false;
  car.lap = 0; car.lapTime = 0; car.lastLap = 0;
  car.started = false;
  car.best = Number(localStorage.getItem(bestKey(trackIdx)) || 0);
  particles = [];
}
loadTrack(0);

// ---------------- input ----------------
const keys = {};
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["w","a","s","d","r","t","c","arrowup","arrowdown","arrowleft","arrowright","enter"," "].includes(k)) e.preventDefault();
  if (k === "c") { carIdx = (carIdx + 1) % CARS.length; saveCar(); }
  if (state === "menu") {
    if (k === "arrowup") menuSel = 0;
    if (k === "arrowdown") menuSel = 1;
    const left = k === "a" || k === "arrowleft";
    const right = k === "d" || k === "arrowright";
    if (menuSel === 0) {
      if (left) loadTrack((trackIdx + TRACKS.length - 1) % TRACKS.length);
      if (right) loadTrack((trackIdx + 1) % TRACKS.length);
    } else {
      if (left) { carIdx = (carIdx + CARS.length - 1) % CARS.length; saveCar(); }
      if (right) { carIdx = (carIdx + 1) % CARS.length; saveCar(); }
    }
    if (k === "w" || k === "enter" || k === " ") { state = "race"; placeAtStart(); }
    return;
  }
  keys[k] = true;
  if (k === "r") placeAtStart();
  if (k === "t" || k === "escape") { state = "menu"; placeAtStart(); }
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// ---------------- helpers ----------------
function findNearest() {
  let best = car.nearest, bd = Infinity;
  for (let off = -35; off <= 35; off++) {
    const i = (car.nearest + off + NS) % NS;
    const dx = car.x - samples[i][0], dy = car.y - samples[i][1];
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  car.nearest = best;
  return Math.sqrt(bd);
}

// ---------------- update ----------------
function update() {
  if (state !== "race") return;

  if (keys["w"] || keys["arrowup"]) {
    if (!car.started) car.started = true;
    car.speed += car.offTrack ? 0.05 : 0.15;
  } else if (keys["s"] || keys["arrowdown"]) {
    car.speed -= car.speed > 0 ? 0.3 : 0.08;
  } else {
    car.speed *= 0.985;
  }

  const maxSpeed = car.offTrack ? 3.0 : 7.4;
  car.speed = Math.max(-2.4, Math.min(maxSpeed, car.speed));

  const steerInput = (keys["a"] || keys["arrowleft"] ? -1 : 0) + (keys["d"] || keys["arrowright"] ? 1 : 0);
  const grip = Math.min(1, Math.abs(car.speed) / 2.2);
  car.angle += steerInput * 0.05 * grip * (car.speed < 0 ? -1 : 1);

  car.x += Math.cos(car.angle) * car.speed;
  car.y += Math.sin(car.angle) * car.speed;
  car.x = Math.max(worldB.minx + 20, Math.min(worldB.maxx - 20, car.x));
  car.y = Math.max(worldB.miny + 20, Math.min(worldB.maxy - 20, car.y));

  cam.x += (car.x - cam.x) * 0.15;
  cam.y += (car.y - cam.y) * 0.15;

  const dist = findNearest();
  car.offTrack = dist > TRACK_W / 2 + 6;
  if (car.offTrack && Math.abs(car.speed) > 1 && Math.random() < 0.5) {
    particles.push({ x: car.x, y: car.y, vx: (Math.random() - .5) * 2, vy: (Math.random() - .5) * 2, r: 2 + Math.random() * 3, life: 22, c: "#4c7a3a" });
  }

  const f = car.nearest / NS;
  if (f > 0.4 && f < 0.6) car.midPassed = true;
  if (car.started) {
    car.lapTime += 1 / 60;
    if (car.midPassed && f >= 0.95) {
      car.midPassed = false;
      car.lap++;
      car.lastLap = car.lapTime;
      if (!car.best || car.lapTime < car.best) {
        car.best = car.lapTime;
        localStorage.setItem(bestKey(trackIdx), car.best);
      }
      car.lapTime = 0;
    }
  }

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

// ---------------- drawing ----------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function makeTowerSprite(w, h, body) {
  const c = document.createElement("canvas");
  c.width = Math.round(w); c.height = Math.round(h);
  const g = c.getContext("2d");
  g.fillStyle = body; g.fillRect(0, 0, w, h);
  const cols = Math.max(2, Math.floor(w / 8)), rows = Math.max(4, Math.floor(h / 12));
  for (let r2 = 0; r2 < rows; r2++) {
    for (let col = 0; col < cols; col++) {
      g.fillStyle = Math.random() < 0.7 ? "#ffd76b" : "#39415a";
      g.fillRect(3 + col * (w - 5) / cols, 5 + r2 * (h - 8) / rows, 4, 6);
    }
  }
  return c;
}

function drawTree(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.scale(o.s, o.s);
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(3, 5, 16, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = curTheme.trunk;
  ctx.fillRect(-3, -2, 6, 12);
  ctx.fillStyle = curTheme.leaves[o.leaf];
  ctx.beginPath(); ctx.arc(0, -14, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = curTheme.leaves[(o.leaf + 1) % curTheme.leaves.length];
  ctx.beginPath(); ctx.arc(-6, -9, 9, 0, Math.PI * 2); ctx.arc(7, -8, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = curTheme.leaves[(o.leaf + 2) % curTheme.leaves.length];
  ctx.beginPath(); ctx.arc(-3, -18, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPine(o) {

  ctx.fillRect(-3, -2, 6, 11);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = curTheme.leaves[(o.leaf + i) % curTheme.leaves.length];
    const yTop = -12 - i * 10, half = 14 - i * 3.5;
    ctx.beginPath();
    ctx.moveTo(0, yTop - 12); ctx.lineTo(-half, yTop); ctx.lineTo(half, yTop);
    ctx.closePath(); ctx.fill();
  }

}

function drawPalm(o) {
  ctx.save();

  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;

}

function drawTower(o) {

function drawLake() {
  if (!lakePath.length) return;
  ctx.fillStyle = "#3f7fb5";
  ctx.beginPath();
  lakePath.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#2f6391"; ctx.lineWidth = 4; ctx.stroke();
  let cx = 0, cy = 0;
  for (const p of lakePath) { cx += p[0]; cy += p[1]; }
  cx /= lakePath.length; cy /= lakePath.length;
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2; ctx.lineCap = "round";
  for (let j = 0; j < 3; j++) {
    ctx.beginPath();
    ctx.arc(cx - 34 + j * 34, cy - 26 + j * 28, 11, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }
}

function onScreen(x, y, m) {
  const hw = W / (2 * ZOOM) + m, hh = H / (2 * ZOOM) + m;
  return x > cam.x - hw && x < cam.x + hw && y > cam.y - hh && y < cam.y + hh;
}

function drawSceneryObjects() {
  for (const s of stands) {
    if (onScreen(s.x, s.y, 140)) drawStand(s);
  }
  for (const o of scenery) {
    if (!onScreen(o.x, o.y, 140)) continue;
    if (o.type === "tree") drawTree(o);
    else if (o.type === "pine") drawPine(o);
    else if (o.type === "palm") drawPalm(o);
    else if (o.type === "tower") drawTower(o);
    else drawHouse(o);
  }
}

function drawScenery() {
  ctx.fillStyle = curTheme.grassA;
  ctx.fillRect(worldB.minx, worldB.miny, worldB.maxx - worldB.minx, worldB.maxy - worldB.miny);
  ctx.fillStyle = curTheme.grassB;
  for (const b of blobs) {
    if (!onScreen(b.x, b.y, 40)) continue;
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, b.a, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTrack() {
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  ctx.lineWidth = TRACK_W + 14;
  ctx.strokeStyle = curTheme.kerbA;
  ctx.setLineDash([]);
  ctx.stroke(trackPath);
  ctx.strokeStyle = curTheme.kerbB;
  ctx.setLineDash([26, 26]);
  ctx.stroke(trackPath);
  ctx.setLineDash([]);

  if (curTheme.night) {
    ctx.lineWidth = TRACK_W + 34;
    ctx.strokeStyle = curTheme.glow;
  ctx.stroke(trackPath);
  }

  ctx.lineWidth = TRACK_W;
  ctx.strokeStyle = curTheme.asphalt;
  ctx.stroke(trackPath);

  ctx.lineWidth = 3;
  ctx.strokeStyle = curTheme.lane;
  ctx.setLineDash([18, 30]);
  ctx.stroke(trackPath);
  ctx.setLineDash([]);

  const s = samples[0], d = trackDir(0);
  ctx.save();
  ctx.translate(s[0], s[1]); ctx.rotate(d);
  const rows = 2, cols = 8, cell = TRACK_W / cols;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = (r + c) % 2 ? "#111" : "#fff";
      ctx.fillRect(-cell + r * cell, -TRACK_W / 2 + c * cell, cell, cell);
    }
  }
  ctx.restore();
}

function drawCarBody() {
  const C = CARS[carIdx];
  ctx.fillStyle = "#222";
  ctx.fillRect(-19, -9, 5, 18);
  ctx.fillRect(14, -10, 4, 20);

  ctx.fillRect(8, -11, 9, 6); ctx.fillRect(8, 5, 9, 6);
  const bg = ctx.createLinearGradient(0, -6, 0, 6);
  bg.addColorStop(0, C.c1); bg.addColorStop(1, C.c2);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-16, -6); ctx.lineTo(6, -7); ctx.lineTo(15, -4);
  ctx.lineTo(15, 4); ctx.lineTo(6, 7); ctx.lineTo(-16, 6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#2b2b33";
  ctx.beginPath(); ctx.ellipse(-4, 0, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.c1;
  ctx.beginPath(); ctx.arc(-4, 0, 4, 0, Math.PI * 2); ctx.fill();

}

function fmt(t) {
  if (!t) return "--:--.--";
  const m = Math.floor(t / 60), s = t % 60;
  return (m ? m + ":" : "") + s.toFixed(2).padStart(m ? 5 : 2, "0");
}

function drawTrackPreview(cx, cy, maxW, maxH) {
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of samples) {
    if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
    if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
  }
  const sc = Math.min(maxW / (maxx - minx), maxH / (maxy - miny));
  const ox = cx - (maxx - minx) * sc / 2 - minx * sc;
  const oy = cy - (maxy - miny) * sc / 2 - miny * sc;
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  samples.forEach((p, i) => i ? ctx.lineTo(p[0] * sc + ox, p[1] * sc + oy) : ctx.moveTo(p[0] * sc + ox, p[1] * sc + oy));
  ctx.closePath();
  ctx.lineWidth = 8; ctx.strokeStyle = curTheme.kerbA; ctx.stroke();
  ctx.lineWidth = 5; ctx.strokeStyle = curTheme.asphalt; ctx.stroke();
  const s0 = samples[0];
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(s0[0] * sc + ox, s0[1] * sc + oy, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

  ctx.fillStyle = "#ffffffcc";
  ctx.fillText("last  " + fmt(car.lastLap), 30, 104);
  ctx.fillText("best  " + fmt(car.best), 30, 124);

  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(10,15,25,.72)";
  rr(W / 2 - 130, 14, 260, 40, 12); ctx.fill();
  ctx.font = "bold 17px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText(trk.flag + " " + trk.name, W / 2, 40);

  ctx.fillStyle = "rgba(10,15,25,.72)";
  rr(W - 140, 14, 126, 54, 12); ctx.fill();
  ctx.fillStyle = car.offTrack ? "#ff9a6b" : "#8ef2a2";
  ctx.font = "bold 24px 'Trebuchet MS', sans-serif";
  ctx.fillText(Math.round(Math.abs(car.speed) * 42) + " kph", W - 77, 48);
  ctx.textAlign = "left";

  if (car.offTrack) {
    ctx.fillStyle = "#ffd94d";
    ctx.font = "bold 18px 'Trebuchet MS', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("OFF TRACK — slow!", W / 2, 76);
    ctx.textAlign = "left";
  }

  if (!car.started) {
    ctx.fillStyle = "rgba(10,15,25,.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 40px 'Trebuchet MS', sans-serif";
    ctx.fillText(trk.flag + " " + trk.name, W / 2, H / 2 - 40);
    ctx.font = "20px 'Trebuchet MS', sans-serif";
    ctx.fillText("hit W / ▲ to launch", W / 2, H / 2 + 6);
    ctx.font = "15px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#ffe066";
    ctx.fillText(trk.corners, W / 2, H / 2 + 40);

    drawCarPreview(W / 2 - 90, H / 2 + 88, 1.25);
    ctx.textAlign = "left";
    ctx.font = "bold 17px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText(CARS[carIdx].name, W / 2 - 45, H / 2 + 84);
    ctx.font = "14px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#ffe066";
    ctx.fillText("press C to change car", W / 2 - 45, H / 2 + 106);
    ctx.textAlign = "left";
  }
}

// ---------------- touch controls ----------------
const isTouch = ("ontouchstart" in window) || (typeof navigator !== "undefined" && (navigator.maxTouchPoints || 0) > 0);
if (isTouch) document.getElementById("wrap").classList.add("touch");

function bindBtn(id, key) {
  const el = document.getElementById(id);
  if (!el || typeof KeyboardEvent === "undefined") return;
  const down = e => { if (e.cancelable) e.preventDefault(); el.classList.add("on"); window.dispatchEvent(new KeyboardEvent("keydown", { key })); };
  const up = e => { if (e.cancelable) e.preventDefault(); el.classList.remove("on"); window.dispatchEvent(new KeyboardEvent("keyup", { key })); };
  el.addEventListener("pointerdown", e => { if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (err) {} } down(e); });
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("lostpointercapture", up);
  el.addEventListener("contextmenu", e => e.preventDefault());
}
bindBtn("b-left", "a");
bindBtn("b-right", "d");
bindBtn("b-gas", "w");
bindBtn("b-brake", "s");
bindBtn("b-car", "c");
bindBtn("b-reset", "r");
bindBtn("b-menu", "t");

cvs.addEventListener("pointerdown", e => {
  if (state === "menu") {
    if (e.cancelable) e.preventDefault();
    window.dispatchEvent(new KeyboardEvent("keydown", { key: "w" }));
  }
});

// ---------------- loop ----------------
function drawWorld() {
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-cam.x, -cam.y);
  drawScenery();
  drawLake();
  drawSceneryObjects();
  drawTrack();
  for (const p of particles) {
    ctx.globalAlpha = p.life / 22;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (curTheme.night) {
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);
    ctx.fillStyle = "rgba(255,240,190,.12)";
    ctx.beginPath();
    ctx.moveTo(18, -5); ctx.lineTo(130, -40); ctx.lineTo(130, 40); ctx.lineTo(18, 5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  drawCar();
  ctx.restore();
}

function drawMinimap() {
  const mw = 210, mh = 150, mx = W - mw - 16, my = H - mh - 42;
  ctx.fillStyle = "rgba(10,15,25,.72)";
  rr(mx, my, mw, mh, 10); ctx.fill();
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of samples) {
    if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
    if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
  }
  const sc = Math.min((mw - 30) / (maxx - minx), (mh - 30) / (maxy - miny));
  const ox = mx + (mw - (maxx - minx) * sc) / 2 - minx * sc;
  const oy = my + (mh - (maxy - miny) * sc) / 2 - miny * sc;
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  samples.forEach((p, i) => i ? ctx.lineTo(p[0] * sc + ox, p[1] * sc + oy) : ctx.moveTo(p[0] * sc + ox, p[1] * sc + oy));
  ctx.closePath();
  ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff55"; ctx.stroke();
  const s0 = samples[0];
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(s0[0] * sc + ox, s0[1] * sc + oy, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffe066";
  ctx.beginPath(); ctx.arc(car.x * sc + ox, car.y * sc + oy, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function frame() {
  update();
  drawWorld();
  if (state === "menu") drawMenu(); else { drawHUD(); drawMinimap(); }
  requestAnimationFrame(frame);
}

if (typeof navigator !== "undefined" && "serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

frame();
})();
</script>
