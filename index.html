<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dinimbo Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #123a1f; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
  #hint {
    position: absolute; inset: auto 0 10px 0; text-align: center;
    color: #ffffffcc; font-size: 13px; letter-spacing: .06em; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1000" height="700"></canvas>
  <div id="hint">W accelerate · S brake/reverse · A/D steer · R reset · T track menu</div>
</div>
<script>
(() => {
"use strict";

const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
const W = cvs.width, H = cvs.height;
const TRACK_W = 64;
const WORLD = 2000;              // max world dimension of a circuit
const ZOOM = 1.9;                // follow-camera zoom

// ---------------- circuits ----------------
// Control points are traced from the real circuits' GPS centerlines
// (bacinger/f1-circuits GeoJSON), resampled and relaxed so the wide arcade
// track stays drivable, then normalized to a 2000px world. Point 0 is the
// real start/finish line, listed in racing direction.
const TRACKS = [
  {
    id: "villeneuve", name: "Gilles Villeneuve", flag: "🇨🇦",
    corners: "Casino straight · L'Épingle hairpin · Wall of Champions chicane",
    pts: [
      [556.4,1448],[603.2,1683.4],[608.1,1887.1],[635.1,1972.8],[595.1,2000],[463.7,1953.6],
      [356.5,1856.5],[299.7,1732],[175.2,1572.1],[139.9,1378.8],[50,1298.3],[16,1223.5],
      [0,1045.9],[11,867.1],[52.3,694.9],[146.8,562.5],[189,421.7],[215,244.5],
      [208.1,0],[400.4,522.2],[521.7,1107.5],[523.3,1272.3],
    ],
  },
  {
    id: "portimao", name: "Portimão", flag: "🇵🇹",
    corners: "climbing esses · hilltop sweepers · long right-hander onto the pit straight",
    pts: [
      [162.5,838.8],[11.1,311.6],[0,177],[106.7,43.3],[280.5,0],[409.2,62.9],
      [314.6,217.7],[301.9,348.6],[536.8,1120.3],[574.1,1123.4],[599.7,1060.9],[614.9,823.2],
      [493.7,418],[524.2,338.3],[612.3,278.1],[678,349.2],[779.8,818.7],[874.5,920.3],
      [1075.2,1051.4],[1122.6,1120.4],[1094.7,1219.2],[851,1346.6],[777.8,1461.1],[757.4,1596.8],
      [800.9,1672.5],[997.2,1538.8],[1064.5,1536.7],[1105.5,1590.1],[1100.9,1670.7],[1058.5,1752.5],
      [857.2,1960.4],[678.4,2000],[590.1,1972.2],[487.3,1879.2],[412.1,1701.5],
    ],
  },
  {
    id: "suzuka", name: "Suzuka", flag: "🇯🇵",
    corners: "figure-8 crossover · S-Curves · Degner 1-2 · hairpin · Spoon · 130R",
    pts: [
      [1718.3,568.4],[1985.4,906.2],[2000,983.5],[1965.2,1044.1],[1902.8,1039.7],[1795.1,914.8],
      [1659.9,833.6],[1585.8,722.7],[1445.9,651.4],[1423.5,607.9],[1425.9,475.2],[1403.8,430.4],
      [1361.3,398.4],[1281.2,375.6],[1198.9,386.7],[1126.2,429.4],[982.2,563.1],[878,580.3],
      [821,543],[795.3,466],[768.9,295.1],[778.1,155.2],[755.8,158.5],[630.8,296.8],
      [552.6,325.2],[467.6,324.5],[358.2,291],[286.4,244.7],[130.6,14.9],[58.8,0],
      [2.7,39.2],[0,83.7],[25.3,128.3],[207.5,267.3],[501.8,389.2],[831.5,494.5],
      [886.8,492.9],[965.9,463.5],[1191,295.4],[1338.7,263.2],[1419.5,268.9],[1534.8,348.5],
    ],
  },
  {
    id: "spa", name: "Spa-Francorchamps", flag: "🇧🇪",
    corners: "La Source · Eau Rouge · Kemmel straight · Les Combes · Pouhon · Blanchimont",
    pts: [
      [360.3,186.2],[284,47.8],[280.8,0],[359.8,19],[499.2,107.9],[802.6,428.8],
      [1010.1,813.6],[1050.8,916.5],[1232.4,1582.7],[1200,1701.9],[1194.1,1804.2],[1171.4,1848],
      [950.3,2000],[910.4,1999.3],[896.7,1953.3],[995.7,1844.2],[1000.6,1771.6],[912.6,1395.6],
      [870,1332.8],[824.2,1311.2],[720.3,1317.3],[657.5,1363.5],[530.2,1637.8],[482.4,1696.2],
      [315,1712.6],[156.4,1880],[111.6,1880.2],[66.4,1857.1],[0,1778.3],[5,1676.2],
      [73.9,1558.1],[194.4,1444.5],[450.3,1281.8],[512.6,1191.6],[564.6,1064.3],[567.5,984.7],
      [498.4,775],[472.8,639],[469.7,558.6],[498.2,440.5],
    ],
  },
];

// ---------------- spline ----------------
function catmullRom(p0, p1, p2, p3, u) {
  const u2 = u * u, u3 = u2 * u;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3),
  ];
}

function buildSamples(pts) {
  const raw = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let s = 0; s < 36; s++) raw.push(catmullRom(p0, p1, p2, p3, s / 36));
  }
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of raw) {
    if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
    if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
  }
  const sc = WORLD / Math.max(maxx - minx, maxy - miny);
  const ox = (WORLD - (maxx - minx) * sc) / 2, oy = (WORLD - (maxy - miny) * sc) / 2;
  return raw.map(p => [(p[0] - minx) * sc + ox, (p[1] - miny) * sc + oy]);
}

// ---------------- state ----------------
let state = "menu";              // menu | race
let trackIdx = 0;
let samples = [], NS = 0;
let particles = [];
let worldB = { minx: 0, miny: 0, maxx: WORLD, maxy: WORLD };
let blobs = [];
let scenery = [];
let stands = [];
const cam = { x: WORLD / 2, y: WORLD / 2 };

const car = {
  x: 0, y: 0, angle: 0, speed: 0,
  nearest: 0, midPassed: false,
  lap: 0, lapTime: 0, lastLap: 0, best: 0,
  started: false, offTrack: false,
};

function bestKey(i) { return "axolotl_gp_best_" + TRACKS[i].id; }

function trackDir(i) {
  const a = samples[(i + 2) % NS], b = samples[(i - 2 + NS) % NS];
  return Math.atan2(a[1] - b[1], a[0] - b[0]);
}

function distToTrack(x, y) {
  let bd = Infinity;
  for (const p of samples) {
    const dx = x - p[0], dy = y - p[1];
    const d = dx * dx + dy * dy;
    if (d < bd) bd = d;
  }
  return Math.sqrt(bd);
}

function loadTrack(i) {
  trackIdx = i;
  samples = buildSamples(TRACKS[i].pts);
  NS = samples.length;
  worldB = { minx: 0, miny: 0, maxx: WORLD, maxy: WORLD };
  for (const p of samples) {
    if (p[0] < worldB.minx) worldB.minx = p[0]; if (p[0] > worldB.maxx) worldB.maxx = p[0];
    if (p[1] < worldB.miny) worldB.miny = p[1]; if (p[1] > worldB.maxy) worldB.maxy = p[1];
  }
  const M = 500;
  worldB.minx -= M; worldB.miny -= M; worldB.maxx += M; worldB.maxy += M;
  blobs = [];
  for (let b = 0; b < 90; b++) {
    blobs.push({
      x: worldB.minx + Math.random() * (worldB.maxx - worldB.minx),
      y: worldB.miny + Math.random() * (worldB.maxy - worldB.miny),
      rx: 18 + Math.random() * 30, ry: 8 + Math.random() * 12,
      a: Math.random() * Math.PI * 2,
    });
  }
  scenery = [];
  const clear = TRACK_W / 2 + 55;
  for (let gx = worldB.minx + 80; gx < worldB.maxx - 80; gx += 150) {
    for (let gy = worldB.miny + 80; gy < worldB.maxy - 80; gy += 150) {
      const x = gx + (Math.random() - .5) * 110, y = gy + (Math.random() - .5) * 110;
      if (distToTrack(x, y) < clear) continue;
      if (Math.random() < 0.5) continue;
      scenery.push({
        type: Math.random() < 0.78 ? "tree" : "house",
        x, y, s: 0.8 + Math.random() * 0.5, r: Math.random() * Math.PI * 2,
        roof: ["#b5453a", "#8a5a3a", "#4a6a8a", "#7a4a6a"][Math.floor(Math.random() * 4)],
      });
    }
  }
  stands = [];
  for (let k = 0; k < 4; k++) {
    const i = Math.round(k * NS / 4) % NS;
    const p = samples[i], d = trackDir(i);
    const side = k % 2 ? 1 : -1;
    const off = TRACK_W / 2 + 52;
    stands.push({
      x: p[0] + Math.cos(d + side * Math.PI / 2) * off,
      y: p[1] + Math.sin(d + side * Math.PI / 2) * off,
      a: d + (side < 0 ? Math.PI : 0),
    });
  }
  cam.x = samples[0][0]; cam.y = samples[0][1];
  placeAtStart();
}

function placeAtStart() {
  car.nearest = 0;
  car.x = samples[0][0]; car.y = samples[0][1];
  car.angle = trackDir(0);
  car.speed = 0; car.midPassed = false;
  car.lap = 0; car.lapTime = 0; car.lastLap = 0;
  car.started = false;
  car.best = Number(localStorage.getItem(bestKey(trackIdx)) || 0);
  particles = [];
}
loadTrack(0);

// ---------------- input ----------------
const keys = {};
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["w","a","s","d","r","t","arrowup","arrowdown","arrowleft","arrowright","enter"," "].includes(k)) e.preventDefault();
  if (state === "menu") {
    if (k === "a" || k === "arrowleft") { loadTrack((trackIdx + TRACKS.length - 1) % TRACKS.length); }
    if (k === "d" || k === "arrowright") { loadTrack((trackIdx + 1) % TRACKS.length); }
    if (k === "w" || k === "arrowup" || k === "enter" || k === " ") { state = "race"; placeAtStart(); }
    return;
  }
  keys[k] = true;
  if (k === "r") placeAtStart();
  if (k === "t" || k === "escape") { state = "menu"; placeAtStart(); }
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// ---------------- helpers ----------------
function findNearest() {
  let best = car.nearest, bd = Infinity;
  for (let off = -35; off <= 35; off++) {
    const i = (car.nearest + off + NS) % NS;
    const dx = car.x - samples[i][0], dy = car.y - samples[i][1];
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  car.nearest = best;
  return Math.sqrt(bd);
}

// ---------------- update ----------------
function update() {
  if (state !== "race") return;

  if (keys["w"] || keys["arrowup"]) {
    if (!car.started) car.started = true;
    car.speed += car.offTrack ? 0.05 : 0.15;
  } else if (keys["s"] || keys["arrowdown"]) {
    car.speed -= car.speed > 0 ? 0.3 : 0.08;
  } else {
    car.speed *= 0.985;
  }

  const maxSpeed = car.offTrack ? 3.0 : 7.4;
  car.speed = Math.max(-2.4, Math.min(maxSpeed, car.speed));

  const steerInput = (keys["a"] || keys["arrowleft"] ? -1 : 0) + (keys["d"] || keys["arrowright"] ? 1 : 0);
  const grip = Math.min(1, Math.abs(car.speed) / 2.2);
  car.angle += steerInput * 0.05 * grip * (car.speed < 0 ? -1 : 1);

  car.x += Math.cos(car.angle) * car.speed;
  car.y += Math.sin(car.angle) * car.speed;
  car.x = Math.max(worldB.minx + 20, Math.min(worldB.maxx - 20, car.x));
  car.y = Math.max(worldB.miny + 20, Math.min(worldB.maxy - 20, car.y));

  cam.x += (car.x - cam.x) * 0.15;
  cam.y += (car.y - cam.y) * 0.15;

  const dist = findNearest();
  car.offTrack = dist > TRACK_W / 2 + 6;
  if (car.offTrack && Math.abs(car.speed) > 1 && Math.random() < 0.5) {
    particles.push({ x: car.x, y: car.y, vx: (Math.random() - .5) * 2, vy: (Math.random() - .5) * 2, r: 2 + Math.random() * 3, life: 22, c: "#4c7a3a" });
  }

  const f = car.nearest / NS;
  if (f > 0.4 && f < 0.6) car.midPassed = true;
  if (car.started) {
    car.lapTime += 1 / 60;
    if (car.midPassed && f >= 0.95) {
      car.midPassed = false;
      car.lap++;
      car.lastLap = car.lapTime;
      if (!car.best || car.lapTime < car.best) {
        car.best = car.lapTime;
        localStorage.setItem(bestKey(trackIdx), car.best);
      }
      car.lapTime = 0;
    }
  }

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

// ---------------- drawing ----------------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTree(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.scale(o.s, o.s);
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(3, 5, 16, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#6b4a2e";
  ctx.fillRect(-3, -2, 6, 12);
  ctx.fillStyle = "#2f6d35";
  ctx.beginPath(); ctx.arc(0, -14, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3d8a42";
  ctx.beginPath(); ctx.arc(-6, -9, 9, 0, Math.PI * 2); ctx.arc(7, -8, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#4da553";
  ctx.beginPath(); ctx.arc(-3, -18, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawHouse(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(o.r);
  ctx.scale(o.s, o.s);
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(3, 5, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#e8d9c4";
  ctx.fillRect(-13, -10, 26, 22);
  ctx.fillStyle = o.roof;
  ctx.beginPath();
  ctx.moveTo(-16, -10); ctx.lineTo(0, -22); ctx.lineTo(16, -10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#5a4632";
  ctx.fillRect(-4, 2, 8, 10);
  ctx.fillStyle = "#9ecbe8";
  ctx.fillRect(6, -5, 6, 6); ctx.fillRect(-12, -5, 6, 6);
  ctx.restore();
}

function drawStand(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.a);
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(6, 8, 62, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3a3a44";
  rr(-55, -16, 110, 30, 5); ctx.fill();
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 ? "#d94b4b" : "#f2f2f2";
    ctx.fillRect(-52 + i * 17.5, -12, 14, 22);
  }
  ctx.fillStyle = "#222";
  ctx.fillRect(-55, 10, 110, 4);
  ctx.restore();
}

function drawSceneryObjects() {
  for (const s of stands) drawStand(s);
  for (const o of scenery) {
    if (o.type === "tree") drawTree(o);
    else drawHouse(o);
  }
}

function drawScenery() {
  ctx.fillStyle = "#2c6b3a";
  ctx.fillRect(worldB.minx, worldB.miny, worldB.maxx - worldB.minx, worldB.maxy - worldB.miny);
  ctx.fillStyle = "#357a44";
  for (const b of blobs) {
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, b.a, 0, Math.PI * 2); ctx.fill();
  }
}

function pathSamples() {
  ctx.beginPath();
  samples.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
}

function drawTrack() {
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  ctx.lineWidth = TRACK_W + 14;
  ctx.strokeStyle = "#d94b4b";
  ctx.setLineDash([]);
  pathSamples(); ctx.stroke();
  ctx.strokeStyle = "#f2f2f2";
  ctx.setLineDash([26, 26]);
  pathSamples(); ctx.stroke();
  ctx.setLineDash([]);

  ctx.lineWidth = TRACK_W;
  ctx.strokeStyle = "#3c3c44";
  pathSamples(); ctx.stroke();

  ctx.lineWidth = 3;
  ctx.strokeStyle = "#e8e8e866";
  ctx.setLineDash([18, 30]);
  pathSamples(); ctx.stroke();
  ctx.setLineDash([]);

  const s = samples[0], d = trackDir(0);
  ctx.save();
  ctx.translate(s[0], s[1]); ctx.rotate(d);
  const rows = 2, cols = 8, cell = TRACK_W / cols;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      ctx.fillStyle = (r + c) % 2 ? "#111" : "#fff";
      ctx.fillRect(-cell + r * cell, -TRACK_W / 2 + c * cell, cell, cell);
    }
  }
  ctx.restore();
}

function drawCar() {
  ctx.save();
  ctx.translate(car.x, car.y);

  ctx.save();
  ctx.rotate(car.angle);
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath(); ctx.ellipse(0, 3, 19, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.rotate(car.angle);

  ctx.fillStyle = "#222";
  ctx.fillRect(-19, -9, 5, 18);
  ctx.fillRect(14, -10, 4, 20);
  ctx.fillStyle = "#161616";
  ctx.fillRect(-12, -11, 9, 6); ctx.fillRect(-12, 5, 9, 6);
  ctx.fillRect(8, -11, 9, 6); ctx.fillRect(8, 5, 9, 6);
  const bg = ctx.createLinearGradient(0, -6, 0, 6);
  bg.addColorStop(0, "#ffe066"); bg.addColorStop(1, "#e6a817");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-16, -6); ctx.lineTo(6, -7); ctx.lineTo(15, -4);
  ctx.lineTo(15, 4); ctx.lineTo(6, 7); ctx.lineTo(-16, 6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#2b2b33";
  ctx.beginPath(); ctx.ellipse(-4, 0, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd94d";
  ctx.beginPath(); ctx.arc(-4, 0, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#ff8fb2"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const by = -3 + i * 3;
      ctx.beginPath();
      ctx.moveTo(-7, by * 0.6);
      ctx.lineTo(-10 - (i % 2), by + side * 1.5);
      ctx.stroke();
    }
  }
  ctx.fillStyle = "#3a2c00";
  ctx.beginPath(); ctx.arc(-2.6, -1.3, 0.9, 0, Math.PI * 2); ctx.arc(-2.6, 1.3, 0.9, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function fmt(t) {
  if (!t) return "--:--.--";
  const m = Math.floor(t / 60), s = t % 60;
  return (m ? m + ":" : "") + s.toFixed(2).padStart(m ? 5 : 2, "0");
}

function drawTrackPreview(cx, cy, maxW, maxH) {
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of samples) {
    if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
    if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
  }
  const sc = Math.min(maxW / (maxx - minx), maxH / (maxy - miny));
  const ox = cx - (maxx - minx) * sc / 2 - minx * sc;
  const oy = cy - (maxy - miny) * sc / 2 - miny * sc;
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  samples.forEach((p, i) => i ? ctx.lineTo(p[0] * sc + ox, p[1] * sc + oy) : ctx.moveTo(p[0] * sc + ox, p[1] * sc + oy));
  ctx.closePath();
  ctx.lineWidth = 8; ctx.strokeStyle = "#d94b4b"; ctx.stroke();
  ctx.lineWidth = 5; ctx.strokeStyle = "#3c3c44"; ctx.stroke();
  const s0 = samples[0];
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(s0[0] * sc + ox, s0[1] * sc + oy, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawMenu() {
  const trk = TRACKS[trackIdx];
  ctx.fillStyle = "rgba(8,14,24,.78)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 52px 'Trebuchet MS', sans-serif";
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 8;
  ctx.fillText("DINIMBO RACING", W / 2, 92);
  ctx.font = "16px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#ffe066";
  ctx.fillText("choose your circuit", W / 2, 122);
  ctx.shadowBlur = 0;

  ctx.fillStyle = "#fff";
  ctx.font = "bold 38px 'Trebuchet MS', sans-serif";
  ctx.fillText(trk.flag + "  " + trk.name, W / 2, 182);
  ctx.font = "15px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#ffffffcc";
  ctx.fillText(trk.corners, W / 2, 212);

  ctx.fillStyle = "rgba(255,255,255,.06)";
  rr(W / 2 - 200, 240, 400, 240, 16); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2;
  rr(W / 2 - 200, 240, 400, 240, 16); ctx.stroke();
  drawTrackPreview(W / 2, 360, 340, 200);

  ctx.font = "bold 20px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#8ef2a2";
  ctx.fillText("best lap   " + fmt(car.best), W / 2, 512);

  ctx.font = "17px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText("◀  A / D  ▶   switch track", W / 2, 566);
  ctx.fillStyle = "#ffe066";
  ctx.font = "bold 19px 'Trebuchet MS', sans-serif";
  ctx.fillText("press W to race", W / 2, 604);

  ctx.font = "13px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#ffffff99";
  ctx.fillText("circuit " + (trackIdx + 1) + " / " + TRACKS.length + "   ·   in race: R reset · T menu", W / 2, 650);
  ctx.textAlign = "left";
}

function drawHUD() {
  const trk = TRACKS[trackIdx];

  ctx.fillStyle = "rgba(10,15,25,.72)";
  rr(14, 14, 250, 118, 12); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px 'Trebuchet MS', sans-serif";
  ctx.fillText("LAP " + (car.lap + 1), 30, 44);
  ctx.font = "bold 30px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#ffe066";
  ctx.fillText(fmt(car.lapTime), 30, 78);
  ctx.font = "15px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#ffffffcc";
  ctx.fillText("last  " + fmt(car.lastLap), 30, 104);
  ctx.fillText("best  " + fmt(car.best), 30, 124);

  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(10,15,25,.72)";
  rr(W / 2 - 130, 14, 260, 40, 12); ctx.fill();
  ctx.font = "bold 17px 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText(trk.flag + " " + trk.name, W / 2, 40);

  ctx.fillStyle = "rgba(10,15,25,.72)";
  rr(W - 140, 14, 126, 54, 12); ctx.fill();
  ctx.fillStyle = car.offTrack ? "#ff9a6b" : "#8ef2a2";
  ctx.font = "bold 24px 'Trebuchet MS', sans-serif";
  ctx.fillText(Math.round(Math.abs(car.speed) * 42) + " kph", W - 77, 48);
  ctx.textAlign = "left";

  if (car.offTrack) {
    ctx.fillStyle = "#ffd94d";
    ctx.font = "bold 18px 'Trebuchet MS', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("OFF TRACK — slow!", W / 2, 76);
    ctx.textAlign = "left";
  }

  if (!car.started) {
    ctx.fillStyle = "rgba(10,15,25,.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 40px 'Trebuchet MS', sans-serif";
    ctx.fillText(trk.flag + " " + trk.name, W / 2, H / 2 - 40);
    ctx.font = "20px 'Trebuchet MS', sans-serif";
    ctx.fillText("hit W to launch", W / 2, H / 2 + 6);
    ctx.font = "15px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#ffe066";
    ctx.fillText(trk.corners, W / 2, H / 2 + 40);
    ctx.textAlign = "left";
  }
}

// ---------------- loop ----------------
function drawWorld() {
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-cam.x, -cam.y);
  drawScenery();
  drawSceneryObjects();
  drawTrack();
  for (const p of particles) {
    ctx.globalAlpha = p.life / 22;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawCar();
  ctx.restore();
}

function drawMinimap() {
  const mw = 210, mh = 150, mx = W - mw - 16, my = H - mh - 42;
  ctx.fillStyle = "rgba(10,15,25,.72)";
  rr(mx, my, mw, mh, 10); ctx.fill();
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of samples) {
    if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0];
    if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1];
  }
  const sc = Math.min((mw - 30) / (maxx - minx), (mh - 30) / (maxy - miny));
  const ox = mx + (mw - (maxx - minx) * sc) / 2 - minx * sc;
  const oy = my + (mh - (maxy - miny) * sc) / 2 - miny * sc;
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  samples.forEach((p, i) => i ? ctx.lineTo(p[0] * sc + ox, p[1] * sc + oy) : ctx.moveTo(p[0] * sc + ox, p[1] * sc + oy));
  ctx.closePath();
  ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff55"; ctx.stroke();
  const s0 = samples[0];
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(s0[0] * sc + ox, s0[1] * sc + oy, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffe066";
  ctx.beginPath(); ctx.arc(car.x * sc + ox, car.y * sc + oy, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function frame() {
  update();
  drawWorld();
  if (state === "menu") drawMenu(); else { drawHUD(); drawMinimap(); }
  requestAnimationFrame(frame);
}

frame();
})();
</script>
